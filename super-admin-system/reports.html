<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reports & Export</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><a href="dashboard.html">← Dashboard</a><strong>Reports & Export</strong></header>
<main class="container">
    <section class="card">
        <h1>Attendance Reports</h1>
        <p class="muted">Generate insights and export your blind-scan logs for university administration.</p>
        
        <div style="margin-top: 20px; display: flex; gap: 15px; align-items: center;">
            <button id="exportBtn" style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">📥 Export Attendance to CSV</button>
        </div>
        
        <div id="statsContainer" style="margin-top: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; border-left: 4px solid #007bff;">
                <h4 style="margin: 0; color: #6c757d; font-size: 14px;">Total Scans</h4>
                <p id="totalScans" style="margin: 5px 0 0; font-size: 24px; font-weight: bold;">0</p>
            </div>
            <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; border-left: 4px solid #28a745;">
                <h4 style="margin: 0; color: #6c757d; font-size: 14px;">Unique Students</h4>
                <p id="uniqueStudents" style="margin: 5px 0 0; font-size: 24px; font-weight: bold;">0</p>
            </div>
        </div>
    </section>
</main>

<!-- Load Supabase and shared configurations -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
async function initReports() {
    try {
        await requireRole(['SUPER_ADMIN']);

        const { data, error } = await supabase
            .from('attendance')
            .select(`
                id,
                session_id,
                in_time,
                out_time,
                students ( student_number )
            `)
            .order('in_time', { ascending: false });

        if (error) {
            console.error('Error fetching data:', error.message);
            return;
        }

        // Calculate summary stats
        const total = data.length;
        const unique = new Set(data.map(r => r.students?.student_number)).size;

        document.getElementById('totalScans').textContent = total;
        document.getElementById('uniqueStudents').textContent = unique;

        // Setup CSV Export Functionality
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!data || data.length === 0) {
                alert('No attendance data available to export.');
                return;
            }

            let csvRows = [];
            // CSV Column Headers
            csvRows.push(['Student Number', 'Session ID', 'In Time', 'Out Time', 'Status'].join(','));

            // Map database rows into CSV format
            data.forEach(record => {
                const studentNum = record.students ? record.students.student_number : 'Unknown';
                const sessionId = record.session_id || '';
                const inTime = record.in_time ? new Date(record.in_time).toISOString() : '';
                const outTime = record.out_time ? new Date(record.out_time).toISOString() : '';
                const status = record.out_time ? 'Completed' : 'Checked In';

                csvRows.push([`"${studentNum}"`, `"${sessionId}"`, `"${inTime}"`, `"${outTime}"`, `"${status}"`].join(','));
            });

            // Trigger file download in browser
            const csvBlob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
            const csvUrl = URL.createObjectURL(csvBlob);
            const a = document.createElement('a');
            a.href = csvUrl;
            a.download = `attendance_report_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

    } catch (err) {
        console.error('Failed to load reports:', err);
    }
}

document.addEventListener('DOMContentLoaded', initReports);
</script>
</body>
</html>
